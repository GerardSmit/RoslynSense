name: Resolve Marketplace identity

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Sign in to Azure using GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Marketplace profile ID
        shell: bash
        run: |
          set -euo pipefail
          profile_id="$(az rest \
            --url https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query id \
            --output tsv)"
          if [[ -z "$profile_id" ]]; then
            echo "::error::The Marketplace profile ID was empty."
            exit 1
          fi
          echo "::notice title=Marketplace managed identity ID::$profile_id"
