name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      extension_channel:
        description: "VS Code Marketplace channel"
        required: true
        type: choice
        options:
          - prerelease
          - stable
        default: prerelease

env:
  NETCOREDBG_VERSION: "3.1.3-1062"

jobs:
  build-test:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The exhaustive suite includes Visual Studio MSBuild, .NET Framework and Windows debugger
        # scenarios. Linux is covered end-to-end by both VS Code integration channels below and
        # by the release container smoke test, without mixing incompatible toolchain assumptions.
        os: [windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore RoslynMCP.sln

      - name: Build
        run: dotnet build RoslynMCP.sln --configuration Release --no-restore --nologo

      - name: Cache netcoredbg
        id: cache-netcoredbg
        uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'Linux' && '~/.local/netcoredbg' || 'C:\netcoredbg\netcoredbg' }}
          key: netcoredbg-v2-${{ runner.os }}-${{ env.NETCOREDBG_VERSION }}

      - name: Install netcoredbg (Linux)
        if: runner.os == 'Linux' && steps.cache-netcoredbg.outputs.cache-hit != 'true'
        run: |
          curl -sSL "https://github.com/Samsung/netcoredbg/releases/download/${{ env.NETCOREDBG_VERSION }}/netcoredbg-linux-amd64.tar.gz" \
            -o /tmp/netcoredbg.tar.gz
          mkdir -p ~/.local
          tar xzf /tmp/netcoredbg.tar.gz -C ~/.local

      - name: Install netcoredbg (Windows)
        if: runner.os == 'Windows' && steps.cache-netcoredbg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/Samsung/netcoredbg/releases/download/${{ env.NETCOREDBG_VERSION }}/netcoredbg-win64.zip"
          $zipPath = "$env:TEMP\netcoredbg.zip"
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath "C:\netcoredbg" -Force

      - name: Add netcoredbg to PATH (Linux)
        if: runner.os == 'Linux'
        run: echo "$HOME/.local/netcoredbg" >> $GITHUB_PATH

      - name: Add netcoredbg to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "C:\netcoredbg\netcoredbg" | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Test
        run: >-
          dotnet test RoslynMCP.sln --configuration Release --no-build --nologo
          -p:UseAppHost=false
          --blame-hang --blame-hang-timeout 3m --blame-hang-dump-type mini
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=tests.trx"
          --results-directory TestResults

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-test-diagnostics-${{ runner.os }}
          path: TestResults
          if-no-files-found: warn

  vscode-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vscode-extension

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Audit shipped dependencies
        run: npm audit --omit=dev

      - name: Package
        run: npx @vscode/vsce package

      - name: Upload vsix
        uses: actions/upload-artifact@v7
        with:
          name: roslyn-sense-vsix
          path: vscode-extension/*.vsix
          if-no-files-found: error

  vscode-integration:
    name: VS Code ${{ matrix.vscode }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            vscode: stable
          - os: ubuntu-latest
            vscode: stable
          - os: ubuntu-latest
            vscode: insiders

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install extension dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Run VS Code integration test (Windows)
        if: runner.os == 'Windows'
        working-directory: vscode-extension
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
        run: npm run test:integration

      - name: Run VS Code integration test (Linux)
        if: runner.os == 'Linux'
        working-directory: vscode-extension
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
        run: xvfb-run -a npm run test:integration

  release_artifacts:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || github.event_name == 'workflow_dispatch'
    needs: [build-test, vscode-extension, vscode-integration]
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      previous_version: ${{ steps.version.outputs.previous_version }}
      extension_prerelease: ${{ steps.version.outputs.extension_prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $tags = @(git tag -l 'v*' --sort=-v:refname)
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME.StartsWith('v')) {
            $version = $env:GITHUB_REF_NAME.Substring(1)
            $previousTag = $tags | Where-Object { $_ -ne $env:GITHUB_REF_NAME } | Select-Object -First 1
          } else {
            $latestTag = $tags | Select-Object -First 1
            if ($latestTag) {
              $base = [version]$latestTag.Substring(1)
            } else {
              [xml]$project = Get-Content RoslynMCP/RoslynMCP.csproj
              $base = [version]$project.Project.PropertyGroup.VersionPrefix
            }
            switch ('${{ github.event.inputs.bump }}') {
              'major' { $version = "$($base.Major + 1).0.0" }
              'minor' { $version = "$($base.Major).$($base.Minor + 1).0" }
              default { $version = "$($base.Major).$($base.Minor).$($base.Build + 1)" }
            }
            $previousTag = $latestTag
          }
          $previousVersion = if ($previousTag) { $previousTag.Substring(1) } else { '' }
          $extensionPrerelease = '${{ github.event_name }}' -eq 'workflow_dispatch' `
            -and '${{ github.event.inputs.extension_channel }}' -eq 'prerelease'
          "version=$version" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
          "tag=v$version" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
          "previous_version=$previousVersion" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
          "extension_prerelease=$($extensionPrerelease.ToString().ToLowerInvariant())" |
            Out-File -Append -FilePath $env:GITHUB_OUTPUT
          Write-Host "Building release $version (previous: $previousVersion, extension prerelease: $extensionPrerelease)"

      - name: Restore and build release binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EXTENSION_PRERELEASE: ${{ steps.version.outputs.extension_prerelease }}
        shell: pwsh
        run: |
          dotnet restore RoslynMCP.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build RoslynMCP.sln --configuration Release --no-restore --nologo `
            -p:ContinuousIntegrationBuild=true -p:Version=$env:VERSION -p:PackageVersion=$env:VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack RoslynMCP/RoslynMCP.csproj --configuration Release --output artifacts `
            --no-build --nologo -p:ContinuousIntegrationBuild=true `
            -p:Version=$env:VERSION -p:PackageVersion=$env:VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package the extension at the release version
        working-directory: vscode-extension
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EXTENSION_PRERELEASE: ${{ steps.version.outputs.extension_prerelease }}
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm version $env:VERSION --no-git-tag-version --allow-same-version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vsceArgs = @('@vscode/vsce', 'package', '--out', "../artifacts/roslyn-sense-$env:VERSION.vsix")
          if ($env:EXTENSION_PRERELEASE -eq 'true') { $vsceArgs += '--pre-release' }
          & npx @vsceArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Windows payloads are in the tool package
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $package = Get-ChildItem artifacts/RoslynSense.*.nupkg | Select-Object -First 1
          $archive = [IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            $names = @($archive.Entries.FullName)
            foreach ($required in @('/workers/x64/', '/workers/x86/', '/tray/')) {
              if (-not ($names | Where-Object { $_.Replace('\', '/').Contains($required) })) {
                throw "Release package is missing $required"
              }
            }
          } finally {
            $archive.Dispose()
          }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.version.outputs.version }}
          path: |
            artifacts/RoslynSense.*.nupkg
            artifacts/roslyn-sense-*.vsix
          if-no-files-found: error

  release_smoke_windows:
    if: needs.release_artifacts.result == 'success'
    needs: release_artifacts
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.release_artifacts.outputs.version }}
          path: artifacts

      - name: Install, stop a live daemon, and update the packaged tool
        env:
          VERSION: ${{ needs.release_artifacts.outputs.version }}
          PREVIOUS_VERSION: ${{ needs.release_artifacts.outputs.previous_version }}
        shell: pwsh
        run: |
          $toolPath = Join-Path $env:RUNNER_TEMP 'roslyn-sense-tool-smoke'
          $stopperPath = Join-Path $env:RUNNER_TEMP 'roslyn-sense-update-stopper'
          if ($env:PREVIOUS_VERSION) {
            dotnet tool install RoslynSense --tool-path $toolPath --version $env:PREVIOUS_VERSION
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet tool install RoslynSense --tool-path $stopperPath --version $env:VERSION `
              --add-source (Resolve-Path artifacts) --ignore-failed-sources
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $exe = Join-Path $toolPath 'roslyn-sense.exe'
            $stopperExe = Join-Path $stopperPath 'roslyn-sense.exe'
            $solution = (Resolve-Path 'vscode-extension/src/test/integration/fixture/Fixture.sln').Path
            # The previous public version may predate daemon mode. The extension bootstraps the
            # new package beside it, so exercise the same path here.
            $daemon = Start-Process -FilePath $stopperExe `
              -ArgumentList @('--host', $solution) `
              -PassThru -WindowStyle Hidden
            Start-Sleep -Seconds 3
            & $stopperExe --stop-daemons
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $daemon.WaitForExit(10000) | Out-Null
            dotnet tool update RoslynSense --tool-path $toolPath --version $env:VERSION `
              --add-source (Resolve-Path artifacts) --ignore-failed-sources
          } else {
            dotnet tool install RoslynSense --tool-path $toolPath --version $env:VERSION `
              --add-source (Resolve-Path artifacts) --ignore-failed-sources
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = & (Join-Path $toolPath 'roslyn-sense.exe') --version
          if ($actual.Trim() -ne $env:VERSION) { throw "Expected $env:VERSION, got $actual" }

  release_smoke_container:
    if: needs.release_artifacts.result == 'success'
    needs: release_artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mcr.microsoft.com/dotnet/sdk:10.0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.release_artifacts.outputs.version }}
          path: artifacts

      - name: Install, stop a live daemon, and update in Docker
        env:
          VERSION: ${{ needs.release_artifacts.outputs.version }}
          PREVIOUS_VERSION: ${{ needs.release_artifacts.outputs.previous_version }}
        shell: bash
        run: |
          set -euo pipefail
          tool_path=/tmp/roslyn-sense-tool-smoke
          stopper_path=/tmp/roslyn-sense-update-stopper
          if [[ -n "$PREVIOUS_VERSION" ]]; then
            dotnet tool install RoslynSense --tool-path "$tool_path" --version "$PREVIOUS_VERSION"
            dotnet tool install RoslynSense --tool-path "$stopper_path" --version "$VERSION" \
              --add-source "$GITHUB_WORKSPACE/artifacts" --ignore-failed-sources
            "$stopper_path/roslyn-sense" --host \
              "$GITHUB_WORKSPACE/vscode-extension/src/test/integration/fixture/Fixture.sln" \
              >/tmp/roslyn-sense-host.log 2>&1 &
            daemon_pid=$!
            sleep 3
            "$stopper_path/roslyn-sense" --stop-daemons
            wait "$daemon_pid" || true
            dotnet tool update RoslynSense --tool-path "$tool_path" --version "$VERSION" \
              --add-source "$GITHUB_WORKSPACE/artifacts" --ignore-failed-sources
          else
            dotnet tool install RoslynSense --tool-path "$tool_path" --version "$VERSION" \
              --add-source "$GITHUB_WORKSPACE/artifacts" --ignore-failed-sources
          fi
          test "$("$tool_path/roslyn-sense" --version)" = "$VERSION"

  publish_release:
    if: >-
      needs.release_artifacts.result == 'success'
      && needs.release_smoke_windows.result == 'success'
      && needs.release_smoke_container.result == 'success'
    needs: [release_artifacts, release_smoke_windows, release_smoke_container]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
    outputs:
      version: ${{ needs.release_artifacts.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install Marketplace publisher
        working-directory: vscode-extension
        run: npm ci

      - name: Download tested release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.release_artifacts.outputs.version }}
          path: artifacts

      - name: Sign in to Azure using GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Marketplace publisher access
        working-directory: vscode-extension
        run: |
          set -euo pipefail
          publisher=$(node -p "require('./package.json').publisher")
          npx @vscode/vsce verify-pat "$publisher" --azure-credential

      - name: Publish to NuGet
        run: >
          dotnet nuget push "artifacts/RoslynSense.*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --skip-duplicate

      - name: Publish to Visual Studio Marketplace
        working-directory: vscode-extension
        env:
          VERSION: ${{ needs.release_artifacts.outputs.version }}
          EXTENSION_PRERELEASE: ${{ needs.release_artifacts.outputs.extension_prerelease }}
        run: |
          set -euo pipefail
          args=(publish --packagePath "../artifacts/roslyn-sense-${VERSION}.vsix" --azure-credential --skip-duplicate)
          if [[ "$EXTENSION_PRERELEASE" == "true" ]]; then
            args+=(--pre-release)
          fi
          npx @vscode/vsce "${args[@]}"

      - name: Create tag (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ needs.release_artifacts.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Generate release notes
        env:
          VERSION: ${{ needs.release_artifacts.outputs.version }}
          PREVIOUS_VERSION: ${{ needs.release_artifacts.outputs.previous_version }}
        run: |
          if [[ -n "$PREVIOUS_VERSION" ]]; then
            log=$(git log --pretty=format:"- %s (%h)" "v$PREVIOUS_VERSION..HEAD" --no-merges)
          else
            log=$(git log --pretty=format:"- %s (%h)" --no-merges)
          fi

          echo "$log" > release_notes.md
          echo "" >> release_notes.md
          echo "**NuGet:** [RoslynSense $VERSION](https://www.nuget.org/packages/RoslynSense/$VERSION)" >> release_notes.md
          echo "" >> release_notes.md
          echo "**VS Code:** [RoslynSense $VERSION](https://marketplace.visualstudio.com/items?itemName=GerardSmit.roslyn-sense)" >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release_artifacts.outputs.tag }}
          name: RoslynSense v${{ needs.release_artifacts.outputs.version }}
          body_path: release_notes.md
          files: |
            artifacts/*.nupkg
            artifacts/*.vsix
          generate_release_notes: false
          prerelease: ${{ needs.release_artifacts.outputs.extension_prerelease == 'true' }}

  # Claude Code reads .claude-plugin/plugin.json from the DEFAULT BRANCH when a user adds or
  # updates the marketplace, not from the release tag — so the manifest has to be synced on the
  # branch after a release, or installed plugins never see the new version. The tool's
  # VersionPrefix and the extension's package.json are synced in the same commit: the release
  # builds override both, so they are not load-bearing, but a dev build that reports a version
  # three releases old is a lie nobody needs to be told.
  #
  # Deliberately a separate job: it pushes a commit, and doing that inside `release` would risk
  # changing the tree that was just packed and published.
  sync-versions:
    if: needs.publish_release.result == 'success'
    needs: publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Sync versions on the default branch
        env:
          VERSION: ${{ needs.publish_release.outputs.version }}
        run: |
          set -euo pipefail

          manifest=.claude-plugin/plugin.json
          jq --arg v "$VERSION" '.version = $v' "$manifest" > "$manifest.tmp"
          mv "$manifest.tmp" "$manifest"

          # sed rather than an XML rewrite: one line changes and the rest of the file, BOM
          # included, stays byte-for-byte what it was.
          sed -i -E "s#<VersionPrefix>[^<]*</VersionPrefix>#<VersionPrefix>$VERSION</VersionPrefix>#" \
            RoslynMCP/RoslynMCP.csproj

          # npm keeps package.json and package-lock.json agreeing, which a jq edit would not.
          (cd vscode-extension && npm version "$VERSION" --no-git-tag-version --allow-same-version)

          git add "$manifest" RoslynMCP/RoslynMCP.csproj \
            vscode-extension/package.json vscode-extension/package-lock.json

          if git diff --cached --quiet; then
            echo "Everything is already at $VERSION; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # [skip ci] matters: this workflow triggers on every push, so without it the bot's own
          # commit would start another CI run.
          git commit -m "chore: sync versions to v$VERSION [skip ci]"

          # The default branch may have moved while the release ran; rebase rather than fail.
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

          git show --stat --format="synced to v$VERSION" HEAD
